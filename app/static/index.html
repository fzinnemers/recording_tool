<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>record — interview recorder</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1b1b19; --muted: #6b6b66;
    --line: #e3e3de; --accent: #b8532c; --accent-ink: #ffffff;
    --ok: #2f7a4f; --warn: #a8631a; --err: #b3352c;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #202024; --ink: #eceae6; --muted: #9a9a94;
      --line: #33333a; --accent: #d4693a; --accent-ink: #1a1a1a;
      --ok: #6bbd8b; --warn: #d69b4a; --err: #e2685c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header a { margin-left: auto; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 24px 64px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  p.lede { color: var(--muted); margin: 0 0 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], select {
    width: 100%; padding: 9px 11px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 5px; font-weight: 400; }
  .check { display: flex; gap: 9px; align-items: flex-start; margin-top: 18px;
           font-size: 13.5px; line-height: 1.45; font-weight: 400; }
  .check input { margin-top: 3px; flex: none; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 22px; }
  a { color: var(--accent); }
  ul.sessions { list-style: none; padding: 0; margin: 0; }
  ul.sessions li { border-bottom: 1px solid var(--line); }
  ul.sessions li:last-child { border-bottom: 0; }
  ul.sessions a {
    display: flex; gap: 14px; align-items: baseline; padding: 13px 4px;
    text-decoration: none; color: inherit;
  }
  ul.sessions a:hover { background: var(--bg); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
  .badge {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 2px 7px; border-radius: 20px;
    border: 1px solid currentColor;
  }
  .badge.done { color: var(--ok); }
  .badge.transcribing { color: var(--warn); }
  .badge.recording { color: var(--accent); }
  .badge.error { color: var(--err); }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }

  .rec-stage { text-align: center; padding: 12px 0 4px; }
  .timer { font: 700 46px/1 ui-monospace, "Cascadia Mono", monospace; letter-spacing: .02em; }
  .dot {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); margin-right: 10px; vertical-align: middle;
  }
  .dot.live { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .meter {
    height: 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 20px; overflow: hidden; margin: 22px 0 8px;
  }
  .meter > i { display: block; height: 100%; width: 0%; background: var(--line);
               transition: width .06s linear; }
  .meter-label { font-size: 12.5px; color: var(--muted); }

  progress { width: 100%; height: 8px; }
  .segments { margin-top: 18px; }
  .seg { display: flex; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .seg:last-child { border-bottom: 0; }
  .seg time {
    font: 600 12.5px/1.7 ui-monospace, "Cascadia Mono", monospace;
    color: var(--muted); flex: none; width: 62px; cursor: pointer;
  }
  .seg time:hover { color: var(--accent); }
  .seg .who {
    font: 600 11.5px/1.9 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); flex: none; width: 54px;
  }
  .seg .who.me { color: var(--accent); }
  /* An unsure label is shown, not hidden — but it should not look certain. */
  .seg .who.unsure { opacity: .5; font-weight: 400; }
  .seg.hit { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  audio { width: 100%; margin-top: 16px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px;
        font-size: 13.5px; margin: 14px 0 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .err {
    background: color-mix(in srgb, var(--err) 12%, transparent);
    border: 1px solid var(--err); border-radius: 7px; padding: 12px;
    font-size: 13.5px; white-space: pre-wrap; margin-top: 16px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
  .toolbar input[type=text] { width: auto; flex: 1; min-width: 180px; }
  .danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
</style>
</head>
<body>
<header>
  <h1>record</h1>
  <span class="sub">local interview recorder &amp; transcriber</span>
  <a href="#/">All interviews</a>
</header>
<main id="app"></main>

<script>
const app = document.getElementById('app');
let CONFIG = { models: ['medium'], default_model: 'medium', languages: {} };
let poller = null;
let recorder = null;   // set while a recording is in progress

const api = async (path, opts) => {
  const res = await fetch('/api' + path, opts || {});
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (err) { /* keep statusText */ }
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
};

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, (c) => ESCAPES[c]);

const clock = (sec) => {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const mm = h ? String(m).padStart(2, '0') : String(m).padStart(2, '0');
  return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
};

const stopPolling = () => { if (poller) { clearInterval(poller); poller = null; } };

// ---------------------------------------------------------------- home

async function viewHome() {
  const data = await api('/sessions');
  const rows = data.sessions.map((s) =>
    '<li><a href="#/s/' + encodeURIComponent(s.id) + '">' +
      '<span class="name">' + esc(s.client) + '</span>' +
      '<span class="badge ' + esc(s.status) + '">' + esc(s.status) + '</span>' +
      '<span class="meta">' + esc(s.created_at.slice(0, 10)) + ' &middot; ' + clock(s.duration) + '</span>' +
    '</a></li>').join('');

  app.innerHTML =
    '<h2>Interviews</h2>' +
    '<p class="lede">Everything stays on this laptop, in the <code>data</code> folder. Nothing is uploaded.</p>' +
    '<div class="row" style="margin-top:0"><button class="primary" id="new">New interview</button></div>' +
    '<div class="panel" style="margin-top:22px">' +
      (rows ? '<ul class="sessions">' + rows + '</ul>' : '<div class="empty">No interviews yet.</div>') +
    '</div>';

  document.getElementById('new').onclick = () => { location.hash = '#/new'; };
}

// ---------------------------------------------------------------- new

async function viewNew() {
  const langs = Object.keys(CONFIG.languages).map((k) =>
    '<option value="' + esc(k) + '">' + esc(CONFIG.languages[k]) + '</option>').join('');
  const models = CONFIG.models.map((m) =>
    '<option value="' + esc(m) + '"' + (m === CONFIG.default_model ? ' selected' : '') + '>' + esc(m) + '</option>').join('');

  app.innerHTML =
    '<h2>New interview</h2>' +
    '<p class="lede">Put the phone on speaker next to the laptop before you start.</p>' +
    '<div class="panel">' +
      '<label for="client">Client / interviewee</label>' +
      '<input type="text" id="client" placeholder="e.g. Jansen Bouw B.V. — Peter" autofocus>' +

      '<label for="language">Spoken language</label>' +
      '<select id="language">' + langs + '</select>' +
      '<div class="hint">Auto-detect copes with a Dutch or an English interview. Pick a language explicitly if the audio is noisy.</div>' +

      '<label for="model">Whisper model</label>' +
      '<select id="model">' + models + '</select>' +
      '<div class="hint"><strong>medium</strong> is the sensible default: roughly real-time on this laptop. ' +
        '<strong>large-v3</strong> is more accurate on Dutch but 2–3× slower. ' +
        'The first use of a model downloads it once (1–3&nbsp;GB) and needs internet.</div>' +

      '<label class="check"><input type="checkbox" id="consent">' +
        '<span>The interviewee has been told this call is being recorded and transcribed, and has agreed. ' +
        'This is stored alongside the recording as a record of consent.</span></label>' +

      '<div class="row"><button class="primary" id="go" disabled>Continue to recording</button>' +
      '<a href="#/">Cancel</a></div>' +
      '<div id="msg" class="hint" style="margin-top:10px"></div>' +
    '</div>';

  const client = document.getElementById('client');
  const consent = document.getElementById('consent');
  const go = document.getElementById('go');
  const sync = () => { go.disabled = !(client.value.trim() && consent.checked); };
  client.oninput = sync;
  consent.onchange = sync;

  go.onclick = async () => {
    go.disabled = true;
    try {
      const meta = await api('/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          client: client.value,
          language: document.getElementById('language').value,
          model: document.getElementById('model').value,
          consent: consent.checked
        })
      });
      location.hash = '#/rec/' + encodeURIComponent(meta.id);
    } catch (e) {
      document.getElementById('msg').textContent = 'Could not start: ' + e.message;
      go.disabled = false;
    }
  };
}

// ---------------------------------------------------------------- record

async function viewRecord(id) {
  const data = await api('/sessions/' + encodeURIComponent(id));
  const meta = data.meta;

  app.innerHTML =
    '<h2>' + esc(meta.client) + '</h2>' +
    '<p class="lede">Check that the level meter moves when the client speaks, then start.</p>' +
    '<div class="panel">' +
      '<label for="mic">Microphone</label>' +
      '<select id="mic"><option>Requesting access…</option></select>' +
      '<div class="hint">Pick whatever hears the room — the built-in mic, or a headset lying next to the phone.</div>' +
      '<div class="rec-stage">' +
        '<div class="meter"><i id="bar"></i></div>' +
        '<div class="meter-label" id="db">—</div>' +
        '<div class="meter-label" id="level">waiting for microphone…</div>' +
        '<div class="timer" style="margin-top:22px">' +
          '<span class="dot" id="dot" style="visibility:hidden"></span><span id="time">00:00</span>' +
        '</div>' +
      '</div>' +
      '<div class="row" style="justify-content:center">' +
        '<button class="primary" id="start" disabled>Start recording</button>' +
        '<button id="stop" disabled>Stop &amp; transcribe</button>' +
      '</div>' +
      '<div id="msg" class="hint" style="text-align:center"></div>' +
    '</div>';

  const micSel = document.getElementById('mic');
  const bar = document.getElementById('bar');
  const level = document.getElementById('level');
  const timeEl = document.getElementById('time');
  const dot = document.getElementById('dot');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const msg = document.getElementById('msg');

  let stream = null;
  let audioCtx = null;
  let analyser = null;
  let raf = null;
  let applied = null;
  const dbEl = document.getElementById('db');

  function drawLevel() {
    const buf = new Uint8Array(analyser.fftSize);
    let peak = 0;
    let peakAt = 0;

    const tick = () => {
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) {
        const d = (buf[i] - 128) / 128;
        sum += d * d;
      }
      const rms = Math.sqrt(sum / buf.length);
      const pct = Math.min(100, rms * 320);
      bar.style.width = pct.toFixed(1) + '%';
      bar.style.background = pct > 88 ? 'var(--err)' : (pct > 4 ? 'var(--ok)' : 'var(--line)');

      // Peak decays after 3s so each speaker's loudest moment stays readable.
      const now = Date.now();
      if (rms > peak || now - peakAt > 3000) { peak = rms; peakAt = now; }
      const db = rms > 0 ? 20 * Math.log10(rms) : -99;
      const pdb = peak > 0 ? 20 * Math.log10(peak) : -99;
      // Below about -50 dBFS speech is too faint for Whisper to resolve.
      dbEl.textContent = 'now ' + (db < -90 ? '—' : db.toFixed(0) + ' dB') +
                         '   ·   peak ' + (pdb < -90 ? '—' : pdb.toFixed(0) + ' dB') +
                         (pdb > -50 ? '  ✓ loud enough' : '  ✗ too faint');
      dbEl.style.color = pdb > -50 ? 'var(--ok)' : 'var(--err)';

      raf = requestAnimationFrame(tick);
    };
    tick();
  }

  // Chrome enables echo cancellation, noise suppression and auto gain control by
  // default. All three exist to isolate the person AT the laptop and discard
  // everything else — and a phone on speakerphone is exactly "everything else":
  // far-field, band-limited, reverberant. Left on, they gate the client's voice
  // to digital silence (a recording made with the defaults contained 16.2%
  // mathematically-zero samples and a -91.5 dBFS floor). Raw capture is the only
  // way to record a second person in the room.
  const RAW_AUDIO = {
    echoCancellation: false,
    noiseSuppression: false,
    autoGainControl: false
  };

  async function openMic(deviceId) {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    const audio = Object.assign({}, RAW_AUDIO);
    if (deviceId) audio.deviceId = { exact: deviceId };
    stream = await navigator.mediaDevices.getUserMedia({ audio: audio });

    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    if (!raf) drawLevel();
    startBtn.disabled = false;

    // Chrome may refuse to honour the constraints; say so rather than pretend.
    const track = stream.getAudioTracks()[0];
    const settings = track.getSettings();
    const stillOn = ['echoCancellation', 'noiseSuppression', 'autoGainControl']
      .filter((k) => settings[k] === true);

    // Stored with the recording. Without this we cannot tell afterwards whether a
    // silent interview was the browser filtering, or the microphone never hearing.
    applied = {
      device: track.label || 'unknown',
      echoCancellation: settings.echoCancellation,
      noiseSuppression: settings.noiseSuppression,
      autoGainControl: settings.autoGainControl,
      sampleRate: settings.sampleRate,
      channelCount: settings.channelCount
    };

    level.textContent = stillOn.length
      ? 'WARNING: ' + stillOn.join(', ') + ' still active — the phone may be filtered out'
      : 'raw capture, no filtering';
    level.style.color = stillOn.length ? 'var(--err)' : '';
  }

  try {
    await openMic(null);
    const devices = await navigator.mediaDevices.enumerateDevices();
    micSel.innerHTML = devices.filter((d) => d.kind === 'audioinput').map((d, i) =>
      '<option value="' + esc(d.deviceId) + '">' + esc(d.label || 'Microphone ' + (i + 1)) + '</option>').join('');
    micSel.onchange = () => { openMic(micSel.value).catch((e) => { msg.textContent = e.message; }); };
  } catch (e) {
    micSel.innerHTML = '<option>No microphone access</option>';
    msg.textContent = 'Microphone blocked: ' + e.message +
      '. Allow it via the padlock in the address bar, then reload this page.';
    return;
  }

  startBtn.onclick = () => {
    let uploads = Promise.resolve();
    let failed = null;
    const started = Date.now();
    const wanted = ['audio/webm;codecs=opus', 'audio/webm'];
    const supported = wanted.filter((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    if (!supported.length) {
      msg.textContent = 'This browser cannot record WebM/Opus. Use Chrome or Edge.';
      return;
    }
    const mr = new MediaRecorder(stream, { mimeType: supported[0] });

    mr.ondataavailable = (ev) => {
      if (!ev.data || !ev.data.size) return;
      // Chained, not parallel: chunk 0 carries the WebM header, so order matters.
      uploads = uploads
        .then(() => fetch('/api/sessions/' + encodeURIComponent(id) + '/chunk',
                          { method: 'POST', body: ev.data }))
        .then((r) => { if (!r.ok) throw new Error('chunk upload failed'); })
        .catch((err) => { failed = err; });
    };

    mr.onstop = async () => {
      clearInterval(timer);
      const duration = (Date.now() - started) / 1000;
      stopBtn.disabled = true;
      dot.classList.remove('live');
      msg.textContent = 'Saving the last seconds…';
      await uploads;
      if (failed) msg.textContent = 'Some audio may not have been saved: ' + failed.message;
      try {
        await api('/sessions/' + encodeURIComponent(id) + '/finish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ duration: duration, capture: applied })
        });
      } catch (e) {
        msg.textContent = 'Could not queue transcription: ' + e.message;
        return;
      }
      recorder = null;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (raf) cancelAnimationFrame(raf);
      location.hash = '#/s/' + encodeURIComponent(id);
    };

    mr.start(5000);
    recorder = mr;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    micSel.disabled = true;
    dot.style.visibility = 'visible';
    dot.classList.add('live');
    msg.textContent = 'Recording. Audio reaches the disk every 5 seconds.';

    var timer = setInterval(() => {
      timeEl.textContent = clock((Date.now() - started) / 1000);
    }, 250);
  };

  stopBtn.onclick = () => { if (recorder && recorder.state !== 'inactive') recorder.stop(); };
}

// ---------------------------------------------------------------- detail

async function viewDetail(id) {
  let shownStatus = null;

  // While transcribing we only nudge the progress bar. Re-rendering the whole
  // panel every 3s would restart audio playback and clear the search box.
  const refresh = async () => {
    const meta = (await api('/sessions/' + encodeURIComponent(id))).meta;
    if (meta.status !== shownStatus) return render();
    const bar = document.querySelector('progress');
    if (bar) bar.value = meta.progress || 0;
  };

  const render = async () => {
    const data = await api('/sessions/' + encodeURIComponent(id));
    const meta = data.meta;
    shownStatus = meta.status;
    const transcript = data.transcript;
    const busy = meta.status === 'transcribing';
    const base = '/api/sessions/' + encodeURIComponent(id);

    let body = '';
    if (meta.status === 'done' && transcript) {
      const NAMES = { me: 'Me', phone: 'Phone' };
      const labelled = transcript.segments.some((s) => NAMES[s.speaker]);
      const who = (s) => {
        if (!labelled) return '';
        const name = NAMES[s.speaker] || '?';
        // Below this the call was close; say so rather than look confident.
        const unsure = !NAMES[s.speaker] || (s.confidence || 0) < 0.35;
        return '<span class="who ' + (s.speaker === 'me' ? 'me' : '') +
               (unsure ? ' unsure' : '') + '">' +
               esc(name) + (unsure && NAMES[s.speaker] ? '?' : '') + '</span>';
      };
      const segs = transcript.segments.map((s) =>
        '<div class="seg" data-text="' + esc(s.text.toLowerCase()) + '">' +
          '<time data-at="' + s.start + '">' + clock(s.start) + '</time>' +
          who(s) +
          '<span>' + esc(s.text) + '</span>' +
        '</div>').join('');
      body =
        '<div class="toolbar">' +
          '<input type="text" id="find" placeholder="Search this transcript…">' +
          '<a href="' + base + '/download/md">.md</a>' +
          (labelled ? '<a href="' + base + '/download/speakers.md">labelled .md</a>' : '') +
          '<a href="' + base + '/download/txt">.txt</a>' +
          '<a href="' + base + '/download/srt">.srt</a>' +
        '</div><div class="segments">' + segs + '</div>';
    } else if (busy) {
      body = '<p class="lede" style="margin:16px 0 8px">Transcribing… you can close this tab, it keeps running.</p>' +
             '<progress value="' + (meta.progress || 0) + '" max="1"></progress>';
    } else if (meta.status === 'error') {
      body = '<div class="err">' + esc(meta.error || 'Something went wrong.') + '</div>';
    }

    app.innerHTML =
      '<h2>' + esc(meta.client) + '</h2>' +
      '<p class="lede"><span class="badge ' + esc(meta.status) + '">' + esc(meta.status) + '</span>' +
        '&nbsp; ' + esc(meta.created_at.slice(0, 16).replace('T', ' ')) + ' UTC &middot; ' + clock(meta.duration) + '</p>' +
      '<div class="panel">' +
        '<audio controls src="' + base + '/audio"></audio>' +
        '<dl class="kv">' +
          '<dt>Language</dt><dd>' + esc(meta.detected_language || meta.language) + '</dd>' +
          '<dt>Model</dt><dd>' + esc(meta.model) + '</dd>' +
          '<dt>Consent</dt><dd>' + (meta.consent
              ? 'recorded ' + esc(String(meta.consent_at || '').slice(0, 16).replace('T', ' ')) + ' UTC'
              : 'not recorded') + '</dd>' +
          '<dt>Folder</dt><dd><code>data\\' + esc(meta.id) + '</code></dd>' +
        '</dl>' + body +
        '<div class="toolbar">' +
          '<button id="redo">Transcribe again</button>' +
          '<button id="del" class="danger">Delete interview</button>' +
        '</div>' +
      '</div>';

    const audio = app.querySelector('audio');
    app.querySelectorAll('.seg time').forEach((t) => {
      t.onclick = () => { audio.currentTime = Number(t.dataset.at); audio.play(); };
    });

    const find = document.getElementById('find');
    if (find) {
      find.oninput = () => {
        const q = find.value.trim().toLowerCase();
        app.querySelectorAll('.seg').forEach((seg) => {
          const hit = Boolean(q) && seg.dataset.text.indexOf(q) !== -1;
          seg.classList.toggle('hit', hit);
          seg.style.display = (!q || hit) ? '' : 'none';
        });
      };
    }

    document.getElementById('redo').onclick = async () => {
      await api(base.replace('/api', '') + '/retranscribe', { method: 'POST' });
      route();
    };
    document.getElementById('del').onclick = async () => {
      if (!window.confirm('Delete this interview, its audio and its transcript?')) return;
      await api('/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
      location.hash = '#/';
    };

    if (busy && !poller) poller = setInterval(() => { refresh().catch(() => {}); }, 3000);
    if (!busy) stopPolling();
  };

  await render();
}

// ---------------------------------------------------------------- routing

async function route() {
  stopPolling();
  const parts = (location.hash || '#/').split('/');
  const section = parts[1];
  const id = parts[2];
  try {
    if (section === 'new') await viewNew();
    else if (section === 'rec' && id) await viewRecord(decodeURIComponent(id));
    else if (section === 's' && id) await viewDetail(decodeURIComponent(id));
    else await viewHome();
  } catch (e) {
    app.innerHTML = '<div class="err">' + esc(e.message) + '</div>' +
                    '<p><a href="#/">Back to all interviews</a></p>';
  }
}

window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', (e) => {
  if (recorder && recorder.state === 'recording') { e.preventDefault(); e.returnValue = ''; }
});

(async () => {
  try { CONFIG = await api('/config'); } catch (e) { /* fall back to defaults */ }
  route();
})();
</script>
</body>
</html>
